name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build embedded frontend assets
        run: |
          npm ci
          npm run build
        working-directory: frontend/web
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p multicloud
      - name: Package debug binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          tar -C target/debug -czf "artifacts/multicloud-debug-${GITHUB_SHA}.tar.gz" multicloud
          sha256sum "artifacts/multicloud-debug-${GITHUB_SHA}.tar.gz" > "artifacts/multicloud-debug-${GITHUB_SHA}.tar.gz.sha256"
      - name: Upload debug artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: multicloud-debug-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
