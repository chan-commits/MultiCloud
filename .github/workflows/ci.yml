name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build embedded frontend assets
        run: |
          npm ci
          npm run build
        working-directory: frontend/web
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p multicloud
      - name: Package release binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          tar -C target/release -czf "artifacts/multicloud-${GITHUB_SHA}-linux-x86_64.tar.gz" multicloud
          sha256sum "artifacts/multicloud-${GITHUB_SHA}-linux-x86_64.tar.gz" > "artifacts/multicloud-${GITHUB_SHA}-linux-x86_64.tar.gz.sha256"
      - name: Upload release artifact
        id: upload-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: multicloud-${{ github.sha }}-linux-x86_64
          path: artifacts/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Add download link to summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## Release build" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download multicloud-${GITHUB_SHA}-linux-x86_64](${{ steps.upload-release.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact retention: 30 days." >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
