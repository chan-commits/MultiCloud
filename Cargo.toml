[workspace]
resolver = "3"
members = [
    "apps/agent",
    "apps/api",
    "apps/scheduler",
    "apps/worker",
    "crates/authorization",
    "crates/configuration",
    "crates/identity",
    "crates/messaging",
    "crates/observability",
    "crates/operation",
    "crates/organization",
    "crates/persistence",
    "crates/provider",
    "crates/resource",
    "crates/shared-kernel",
    "migrations",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.100"
aes-gcm = "0.10.3"
async-trait = "0.1.92"
axum = "0.8.9"
argon2 = "0.5.3"
base64 = "0.22.1"
config = "0.15.25"
redis = { version = "1.6.0", features = ["tokio-comp"] }
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "2.0.2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-json",
    "with-ipnetwork",
    "with-time",
    "with-uuid",
] }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sha1 = "0.10.6"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.1", features = ["serde", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
